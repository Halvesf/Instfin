<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Pablo Finanças</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app de uma coluna estilo rede social — topo fixo, stories, feed de movimentações, barra inferior. Céu noturno com rastros de luz. */
:root{
  --bg:#05060A; --surface:#0E1016; --surface-2:#161922; --line:#1E222D;
  --fg:#F4F1EC; --fg-2:#C9CCD6; --fg-3:#8E94A3;
  --accent:#FF4D5E; --accent-ink:#140306; --danger-bg:#3A0E15; --danger-fg:#FFC2C8;
  --ok:#6FDCA8; --warn:#FFB547;
  --display:"Sora", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;padding-top:env(safe-area-inset-top,0px)}
body{min-height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--display);font-size:14px;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
img{max-width:100%}
[hidden]{display:none!important}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.nebula{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(70% 45% at 95% 0%, rgba(40,72,130,.35), transparent 70%)}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button,label[for]{cursor:pointer}
:focus-visible{outline:2px solid #DCE6FF;outline-offset:2px;border-radius:8px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:4px;padding:10px 8px;background:linear-gradient(var(--bg) 70%, rgba(5,6,10,0))}
.ibtn{width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:12px;flex-shrink:0}
.ibtn svg{width:24px;height:24px}
.month{display:flex;align-items:center;gap:2px;min-width:0}
.month strong{font-size:19px;font-weight:700;letter-spacing:-.4px;min-width:140px;text-align:center;text-transform:capitalize;white-space:nowrap}
.month .ibtn svg{width:18px;height:18px}
.h1{font-size:18px;font-weight:700;letter-spacing:-.3px;text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* anéis e avatares (cores vêm de variáveis por personalidade) */
.ring{display:inline-block;width:72px;height:72px;border-radius:50%;padding:3px;background:conic-gradient(var(--c1),var(--c2),var(--c1));flex-shrink:0}
.ring .in{width:100%;height:100%;border-radius:50%;border:3px solid var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;background:var(--bgc);color:var(--fgc);overflow:hidden}
.ring img,.av img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;border:1.5px solid var(--c2);background:var(--bgc);color:var(--fgc);overflow:hidden}

/* stories */
.stories{display:flex;gap:16px;padding:4px 16px 16px;overflow-x:auto;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;padding:0;width:78px;flex-shrink:0}
.story .nm{font-size:12px;color:var(--fg);max-width:78px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story .sd{font-size:11px;color:var(--fg-3);white-space:nowrap}
.ring.add{background:#2A2D38}
.ring.add .in{background:var(--surface);color:var(--fg-2)}
.ring.add svg{width:24px;height:24px}

.banner{margin:0 16px 12px;padding:12px 14px;border-radius:12px;background:var(--danger-bg);color:var(--danger-fg);font-size:13px;line-height:1.45;display:flex;gap:10px;align-items:flex-start}
.banner svg{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.notice{margin:0 16px 12px;padding:10px 14px;border-radius:12px;background:var(--surface);color:var(--fg-2);font-size:12px;line-height:1.5}

/* post */
.post{border-top:1px solid var(--line);padding-bottom:12px}
.ph{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 10px 16px;gap:8px}
.ph .who{display:flex;align-items:center;gap:10px;min-width:0}
.ph .meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.ph .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .s{font-size:12px;color:var(--fg-3)}
.pin{font-size:11px;color:#F2C14E;margin-left:6px;font-weight:600}
.pb{position:relative;height:230px;overflow:hidden;background:radial-gradient(120% 85% at 92% 6%, #12233F 0%, rgba(5,6,10,.4) 60%)}
.pb.has-photo{height:auto;min-height:0;background:#000}
.pb.has-photo .photo{display:block;width:100%;max-height:520px;object-fit:cover}
.pb.has-photo .val{top:auto;bottom:0;left:0;right:0;padding:48px 20px 18px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.78))}
.pb .val{position:absolute;left:20px;top:34px;display:flex;flex-direction:column;gap:6px}
.pb .lbl{font-size:12px;color:var(--fg-3);letter-spacing:1.2px;text-transform:uppercase}
.pb.has-photo .lbl{color:#D8DBE4}
.pb .big{font-size:40px;font-weight:500;letter-spacing:-1.5px;color:var(--fg)}
.pb .big.gasto{color:var(--fg-2)}
.pb.has-photo .big.gasto{color:#E6E8EE}
.pb .sub{font-size:13px;color:var(--fg-2)}
.pb.has-photo .sub{color:#E6E8EE}
.pb svg.trail{position:absolute;left:0;bottom:0;width:100%;height:120px}
.pa{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 0}
.pa .l{display:flex}
.pa .on-ok{color:var(--ok)}
.pa .on-pin{color:#F2C14E}
.state{font-size:12px;color:var(--fg-3);padding-right:8px}
.cap{margin:2px 16px 0;font-size:13px;line-height:1.5;color:var(--fg-2);overflow-wrap:anywhere}
.cap b{color:var(--fg)}
.confirm{margin:6px 16px 0;padding:12px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;line-height:1.45}
.confirm .row{display:flex;gap:8px;flex-wrap:wrap}

.empty{margin:24px 16px;padding:28px 20px;border-radius:16px;border:1px dashed #2A2D38;text-align:center;color:var(--fg-2);line-height:1.6}
.empty strong{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--surface-2);color:var(--fg);font-weight:600;font-size:14px;text-decoration:none}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger-bg);color:var(--danger-fg)}
.btn.block{width:100%;min-height:54px;font-size:16px;border-radius:14px}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:18px;height:18px}

/* perfil */
.ptabs{display:flex;gap:8px;padding:4px 16px 14px;overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.av svg{width:18px;height:18px}
.ptab{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 14px 4px 4px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:13px;white-space:nowrap;flex-shrink:0}
.ptab.on{background:var(--surface-2);border-color:#3A3E4A}
.ptab .av{width:32px;height:32px;font-size:12px}
.ptab.new{padding:4px 14px;color:var(--fg-2)}
.phead{display:flex;align-items:center;gap:20px;padding:6px 16px 10px}
.phead .ring{width:92px;height:92px}
.phead .ring .in{font-size:30px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;flex:1;text-align:center;min-width:0}
.stats div{display:flex;flex-direction:column;gap:3px;min-width:0}
.stats .num{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats span:last-child{font-size:12px;color:var(--fg-2)}
.bio{padding:2px 16px 12px;display:flex;flex-direction:column;gap:3px}
.bio b{font-size:14px}
.bio span{font-size:13px;color:var(--fg-2);line-height:1.5;overflow-wrap:anywhere;white-space:pre-line}
.pactions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 16px 14px}
.meter{padding:0 16px 14px;display:flex;flex-direction:column;gap:6px}
.meter .row{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--fg-2)}
.bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;border-top:1px solid var(--line);padding-top:2px}
.tile{position:relative;aspect-ratio:1/1;max-width:100%;padding:10px;display:flex;flex-direction:column;justify-content:space-between;background:var(--surface);min-width:0;overflow:hidden}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,0) 45%,rgba(0,0,0,.72))}
.tile .c,.tile .num{position:relative;z-index:1}
.tile .c{font-size:11px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .num{font-size:14px}
.tile.ph .c{color:#D8DBE4;order:2}
.tile.ph .num{color:#fff;order:3}
.tile.ph{justify-content:flex-end;gap:2px}

/* extrato */
.search{margin:0 16px 10px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.search svg{width:18px;height:18px;color:var(--fg-3);flex-shrink:0}
.search input{flex:1;min-width:0;height:44px;border:0;background:transparent;outline:none}
.chips{display:flex;gap:8px;padding:0 16px 14px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid #2A2D38;background:transparent;font-size:13px;color:var(--fg-2)}
.chip.on{border-color:var(--fg);color:var(--fg);background:var(--surface-2)}
.totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 16px 14px}
.totals div{padding:12px;border-radius:12px;background:var(--surface);display:flex;flex-direction:column;gap:4px;min-width:0}
.totals span:first-child{font-size:11px;color:var(--fg-3);text-transform:uppercase;letter-spacing:1px}
.totals .num{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day{padding:12px 16px 6px;font-size:12px;color:var(--fg-3);text-transform:uppercase;letter-spacing:1px}
.row-m{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.row-m .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-m .mid b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-m .mid span{font-size:12px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-m .num{font-size:14px;white-space:nowrap}
.pos{color:var(--ok)} .neu{color:var(--fg-2)}

/* formulários */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding:env(safe-area-inset-top,0px) 0 calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-in{max-width:520px;margin:0 auto}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:4px 16px 0;padding:4px;border-radius:12px;background:var(--surface)}
.seg button{min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--fg-2);font-size:13px}
.seg button.on{background:var(--fg);color:var(--bg);font-weight:600}
.pick{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 0 4px}
.pick .lab{font-size:12px;color:var(--fg-2);padding:0 16px;text-align:center}
.pick-row{display:flex;gap:10px;padding:0 16px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.pick-row::-webkit-scrollbar{display:none}
.pbtn{border:0;background:transparent;padding:0;border-radius:50%;opacity:.35;transition:opacity .15s;flex-shrink:0}
.pbtn.on{opacity:1}
.pbtn .ring{width:60px;height:60px}
.pbtn .ring .in{font-size:18px}
.swap{width:44px;height:44px;border-radius:50%;border:1px solid #2A2D38;background:var(--surface);display:flex;align-items:center;justify-content:center}
.swap svg{width:20px;height:20px}
.field{display:flex;flex-direction:column;gap:8px;padding:10px 16px}
.field>label,.field>.lab{font-size:13px;color:var(--fg-2)}
.field .help{font-size:12px;color:var(--fg-3);line-height:1.5}
.sec{font-size:15px;color:var(--fg);font-weight:600;padding:18px 16px 0}
.amount{width:100%;text-align:center;border:0;background:transparent;font-family:var(--mono);font-size:46px;font-weight:500;letter-spacing:-1.5px;outline:none;padding:4px 0}
.amount-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 16px 0}
.amount-wrap label{font-size:12px;color:var(--fg-3);letter-spacing:1.2px;text-transform:uppercase}
.hint{font-size:12px;color:var(--fg-3);text-align:center}
.inp{min-height:46px;padding:0 14px;border-radius:12px;border:1px solid #2A2D38;background:var(--surface);outline:none;width:100%}
textarea.inp{padding:12px 14px;min-height:84px;resize:vertical;line-height:1.5}
.inp:focus{border-color:#4A4F5E}
.file{min-height:52px;border-radius:12px;border:1px dashed #3A3E4A;background:transparent;color:var(--fg-2);display:flex;align-items:center;justify-content:center;gap:10px;padding:0 14px;text-align:center}
.file svg{width:20px;height:20px;flex-shrink:0}
.preview{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.preview img{width:72px;height:72px;object-fit:cover;border-radius:10px}
.err{margin:6px 16px 0;font-size:13px;color:var(--danger-fg)}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid transparent;padding:0;background:conic-gradient(var(--c1),var(--c2),var(--c1))}
.sw.on{border-color:var(--fg)}
.avatar-edit{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 16px 4px}
.avatar-edit .ring{width:112px;height:112px}
.avatar-edit .ring .in{font-size:36px}
.avatar-edit .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.foot{padding:18px 16px 8px;font-size:12px;color:var(--fg-3);line-height:1.6}
.plist{display:flex;flex-direction:column}
.plist button{display:flex;align-items:center;gap:12px;padding:10px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;min-height:56px}
.plist button span{flex:1;min-width:0}
.plist button svg{width:18px;height:18px;color:var(--fg-3)}

/* recorte de foto */
.crop{position:fixed;inset:0;z-index:40;background:rgba(5,6,10,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.crop h2{margin:0;font-size:16px;font-weight:600}
.crop canvas{width:min(84vw,320px);height:min(84vw,320px);border-radius:16px;touch-action:none;cursor:grab;background:#000}
.crop .zoom{display:flex;align-items:center;gap:12px;width:min(84vw,320px)}
.crop .zoom input{flex:1;accent-color:var(--fg)}
.crop .zoom span{font-size:12px;color:var(--fg-3)}
.crop .row{display:flex;gap:8px;width:min(84vw,320px)}
.crop .row .btn{flex:1}
.crop p{margin:0;font-size:12px;color:var(--fg-3);text-align:center}

/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(10,11,16,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:520px;margin:0 auto;height:64px;display:flex;align-items:center;justify-content:space-around}
.nav .ibtn{width:52px;height:52px;color:var(--fg-3)}
.nav .ibtn.on{color:var(--fg)}
.nav .plus{width:52px;height:40px;border-radius:12px;border:0;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center}
.nav .plus svg{width:22px;height:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;padding:10px 16px;border-radius:999px;background:var(--fg);color:var(--bg);font-size:13px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="nebula" aria-hidden="true"></div>
<div id="app"></div>
<div id="sheet" class="sheet" hidden></div>
<div id="crop" class="crop" hidden role="dialog" aria-modal="true" aria-labelledby="crop-t"></div>
<div id="toast" class="toast" role="status" hidden></div>
<nav class="nav" aria-label="Navegação principal"><div class="nav-in" id="nav"></div></nav>

<script>
(function(){
/* ======================================================================
   CONFIGURAÇÃO FIXA
   ====================================================================== */
const CORES = {
  azul:    {c1:"#DCE6FF", c2:"#4F7BD9", bg:"#0B1530", fg:"#DCE6FF", trail:"#DCE6FF", nome:"Azul"},
  vermelho:{c1:"#FF4D5E", c2:"#FF9A62", bg:"#2A0A10", fg:"#FFC2C8", trail:"#FF4D5E", nome:"Vermelho"},
  dourado: {c1:"#F2C14E", c2:"#B9852A", bg:"#2A2108", fg:"#F2C14E", trail:"#F2C14E", nome:"Dourado"},
  verde:   {c1:"#6FDCA8", c2:"#2E9E6E", bg:"#0A2219", fg:"#A8F0CC", trail:"#6FDCA8", nome:"Verde"},
  roxo:    {c1:"#C3A6FF", c2:"#7B5CE0", bg:"#1B1233", fg:"#DCCBFF", trail:"#C3A6FF", nome:"Roxo"},
  ciano:   {c1:"#7FE3F0", c2:"#2A9FB8", bg:"#08222A", fg:"#BFF4FA", trail:"#7FE3F0", nome:"Ciano"},
  cinza:   {c1:"#C9CCD6", c2:"#5A6070", bg:"#161922", fg:"#C9CCD6", trail:"#8E94A3", nome:"Cinza"}
};
const CATS = {
  gasto:["Comida","Lazer","Compras","Transporte","Contas","Saúde","Outro"],
  entrada:["Salário","PPR","Extra","Rendimento","Reembolso","Outro"],
  transfer:["Mesada","Guardar","Investir","Reembolso","Outro"]
};
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const brl = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const money = c => brl.format((c||0)/100);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const pad = n => String(n).padStart(2,"0");
const today = () => { const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const ymOf = s => s.slice(0,7);
const newId = () => Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);

/* ======================================================================
   ESTADO
   ====================================================================== */
const S = {
  movs:[], pers:[], cfg:{reservaMeses:6},
  view:"home", perfil:null, month:today().slice(0,7), filtro:"all", busca:"",
  del:null, ready:false, form:null, edit:null, crop:null, err:"", dbErro:false, importar:false
};
const PM = () => Object.fromEntries(S.pers.map(p=>[p.id,p]));
const getP = id => S.pers.find(p=>p.id===id);

/* ======================================================================
   ARMAZENAMENTO NO APARELHO (IndexedDB)
   ====================================================================== */
const IDB = {
  db:null,
  open(){
    return new Promise((res,rej)=>{
      const r = indexedDB.open("pablo-financas",2);
      r.onupgradeneeded = ()=>{ const d=r.result;
        if(!d.objectStoreNames.contains("movs")) d.createObjectStore("movs",{keyPath:"id"});
        if(!d.objectStoreNames.contains("cfg")) d.createObjectStore("cfg");
        if(!d.objectStoreNames.contains("fotos")) d.createObjectStore("fotos");
        if(!d.objectStoreNames.contains("pers")) d.createObjectStore("pers",{keyPath:"id"}); };
      r.onsuccess = ()=>{ IDB.db=r.result; res(); };
      r.onerror = ()=>rej(r.error);
    });
  },
  tx(store, mode, fn){
    return new Promise((res,rej)=>{
      const t = IDB.db.transaction(store, mode); const st = t.objectStore(store);
      const out = fn(st); t.oncomplete = ()=>res(out && "result" in out ? out.result : undefined);
      t.onerror = ()=>rej(t.error); t.onabort = ()=>rej(t.error);
    });
  },
  all(store){ return IDB.tx(store,"readonly",st=>st.getAll()); },
  keys(store){ return IDB.tx(store,"readonly",st=>st.getAllKeys()); },
  get(store,key){ return IDB.tx(store,"readonly",st=>st.get(key)); },
  put(store,val,key){ return IDB.tx(store,"readwrite",st=>key===undefined?st.put(val):st.put(val,key)); },
  del(store,key){ return IDB.tx(store,"readwrite",st=>st.delete(key)); },
  clear(store){ return IDB.tx(store,"readwrite",st=>st.clear()); }
};
const fotoCache = new Map();
async function fotoURL(id){
  if(fotoCache.has(id)) return fotoCache.get(id);
  if(!IDB.db) return null;
  const b = await IDB.get("fotos", id); if(!b) return null;
  const u = URL.createObjectURL(b); fotoCache.set(id,u); return u;
}
async function hidratarFotos(root){
  for(const img of (root||document).querySelectorAll("img[data-foto]")){
    if(img.getAttribute("src")) continue;
    const u = await fotoURL(img.dataset.foto);
    if(u) img.src=u; else img.remove();
  }
}
async function guardarFoto(blob, prefixo){
  const id = prefixo+"-"+newId();
  if(IDB.db) await IDB.put("fotos", blob, id);
  fotoCache.set(id, URL.createObjectURL(blob));
  return id;
}
async function apagarFoto(id){
  if(!id) return;
  try{ if(IDB.db) await IDB.del("fotos", id); }catch(_){}
  const u = fotoCache.get(id); if(u) URL.revokeObjectURL(u); fotoCache.delete(id);
}
function comprimir(file, max){
  return new Promise(res=>{
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = ()=>{
      const k=Math.min(1,(max||1400)/Math.max(im.width,im.height));
      const c=document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url);
      c.toBlob(b=>res(b||file),"image/jpeg",.82);
    };
    im.onerror = ()=>{ URL.revokeObjectURL(url); res(file); };
    im.src = url;
  });
}

function saldo(pid){
  const p = getP(pid); let s = (p&&p.saldoInicial)||0;
  for(const m of S.movs){
    if(m.tipo==="entrada" && m.conta===pid) s+=m.valor;
    else if(m.tipo==="gasto" && m.conta===pid) s-=m.valor;
    else if(m.tipo==="transfer"){ if(m.para===pid) s+=m.valor; if(m.de===pid) s-=m.valor; }
  }
  return s;
}
const doMes = () => S.movs.filter(m=>ymOf(m.data)===S.month);
function fluxo(pid, list){
  let ent=0, sai=0;
  for(const m of list){
    if(m.tipo==="entrada" && m.conta===pid) ent+=m.valor;
    if(m.tipo==="gasto" && m.conta===pid) sai+=m.valor;
    if(m.tipo==="transfer"){ if(m.para===pid) ent+=m.valor; if(m.de===pid) sai+=m.valor; }
  }
  return {ent,sai};
}
const gastosMes = pid => doMes().filter(m=>m.tipo==="gasto"&&m.conta===pid).reduce((a,m)=>a+m.valor,0);
const envolve = (m,pid) => m.conta===pid||m.de===pid||m.para===pid;
const usos = pid => S.movs.filter(m=>envolve(m,pid)).length;
function titulo(m){
  if(m.tipo==="transfer") return nm(m.de)+" → "+nm(m.para);
  if(m.tipo==="entrada") return "Entrada · "+nm(m.conta);
  return "Gasto · "+nm(m.conta);
}
const origem = m => m.tipo==="transfer"?m.de:m.conta;
function quando(m){
  const [,mo,d]=m.data.split("-").map(Number);
  const dt = new Date(m.ts||Date.now());
  return d+" "+MESES[mo-1].slice(0,3)+", "+pad(dt.getHours())+":"+pad(dt.getMinutes());
}
const mesNome = ym => MESES[Number(ym.slice(5))-1];
function mesLabel(ym){ const [y,m]=ym.split("-").map(Number); return MESES[m-1]+" "+y; }
function shiftMonth(n){ let [y,m]=S.month.split("-").map(Number); m+=n; if(m<1){m=12;y--;} if(m>12){m=1;y++;} S.month=y+"-"+pad(m); }

function vars(p){ const c=corOf(p); return "--c1:"+c.c1+";--c2:"+c.c2+";--bgc:"+c.bg+";--fgc:"+c.fg; }
function ring(p, extraCls){
  return '<span class="ring '+(extraCls||"")+'" style="'+vars(p)+'"><span class="in">'+(p&&p.foto?'<img data-foto="'+esc(p.foto)+'" alt="">':esc(ini(p)))+'</span></span>';
}
function av(p){
  return '<span class="av" style="'+vars(p)+'" aria-hidden="true">'+(p&&p.foto?'<img data-foto="'+esc(p.foto)+'" alt="">':esc(ini(p)))+'</span>';
}
function hash(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h); }
function trails(m){
  const h = hash(m.id), a = 20+(h%40), b = 10+((h>>3)%40);
  const t = id => corOf(getP(id)).trail, fora = CORES.cinza.trail;
  let c1, c2;
  if(m.tipo==="transfer"){ c1=t(m.de); c2=t(m.para); }
  else if(m.tipo==="entrada"){ c1=fora; c2=t(m.conta); }
  else { c1=t(m.conta); c2=fora; }
  return '<svg class="trail" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true">'
   +'<path d="M-10 112 C 130 '+(104-b/3)+', 260 '+(70-b/2)+', 410 '+b+'" fill="none" stroke="'+c1+'" stroke-width="2.4" opacity=".85"/>'
   +'<path d="M-10 118 C 140 '+(112-b/4)+', 270 '+(86-b/3)+', 410 '+(b+22)+'" fill="none" stroke="'+c1+'" stroke-width="1" opacity=".35"/>'
   +'<path d="M-10 96 C 140 100, 260 104, 410 '+(60+a/2)+'" fill="none" stroke="'+c2+'" stroke-width="3" opacity=".9"/>'
   +'<path d="M-10 88 C 140 92, 270 96, 410 '+(50+a/2)+'" fill="none" stroke="'+c2+'" stroke-width="1" opacity=".4"/>'
   +'</svg>';
}
function topMonth(){

   +'<div class="month"><button class="ibtn" data-a="mes" data-n="-1" aria-label="Mês anterior">'+I.l+'</button>'

    +'<button class="story" data-a="nova-pers"><span class="ring add"><span class="in">'+I.plus+'</span></span><span class="nm" style="color:var(--fg-2)">Nova</span><span class="sd">&nbsp;</span></button></div>';
  if(S.dbErro) h += '<div class="notice">Este navegador não deixou o app salvar no aparelho (aba anônima ou armazenamento bloqueado). O que registrar aqui some ao fechar.</div>';
  for(const p of S.pers){
    if(p.limite>0){
      const pct = Math.round(gastosMes(p.id)/p.limite*100);
      if(pct>=80) h += '<div class="banner" role="status">'+I.alert+'<span>'+esc(p.curto)+' já usou '+pct+'% do limite de '+mesNome(S.month)+'.'+(pct>=100?' Passou do limite.':'')+'</span></div>';
    }
  }
  const list = doMes().slice().sort((a,b)=>(b.fixado?1:0)-(a.fixado?1:0)||b.ts-a.ts);
  if(!S.ready) h += '<div class="empty"><strong>Carregando…</strong>Buscando suas movimentações.</div>';
  else if(!list.length) h += '<div class="empty"><strong>Nada em '+mesNome(S.month)+' ainda</strong>Toque no + para registrar uma entrada, um gasto ou uma transferência. Coloque uma foto: ela vira lembrança no perfil.</div>';
  else h += list.map(post).join("");
  return h;
}

function post(m){
  const o = getP(origem(m));
  const lbl = m.tipo==="transfer"?(m.categoria||"Transferência"):(m.categoria||(m.tipo==="entrada"?"Entrada":"Gasto"));
  const sub = m.tipo==="transfer" ? "saiu do "+nm(m.de)+", chegou no "+nm(m.para)
            : m.tipo==="entrada" ? "entrou no "+nm(m.conta) : "saiu do "+nm(m.conta);
  let h = '<article class="post">'
   +'<div class="ph"><div class="who">'+av(o)+'<div class="meta"><span class="t">'+esc(titulo(m))+(m.fixado?'<span class="pin">FIXADO</span>':'')+'</span><span class="s">'+esc(quando(m))+'</span></div></div>'
   +'<button class="ibtn" data-a="menu" data-id="'+esc(m.id)+'" aria-label="Opções">'+I.dots+'</button></div>';
  if(S.del===m.id) h += '<div class="confirm"><span>Apagar esta movimentação e a foto dela?</span><div class="row"><button class="btn" data-a="menu" data-id="">Cancelar</button><button class="btn danger" data-a="apagar" data-id="'+esc(m.id)+'">Apagar</button></div></div>';
  const val = '<div class="val"><span class="lbl">'+esc(lbl)+'</span><span class="big num '+(m.tipo==="gasto"?"gasto":"")+'">'+(m.tipo==="gasto"?"−":"")+money(m.valor)+'</span><span class="sub">'+esc(sub)+'</span></div>';
  if(m.foto) h += '<div class="pb has-photo"><img class="photo" data-foto="'+esc(m.foto)+'" alt="Foto da movimentação">'+val+'</div>';
  else h += '<div class="pb">'+val+trails(m)+'</div>';
  h += '<div class="pa"><div class="l">'
   +'<button class="ibtn '+(m.conferido?"on-ok":"")+'" data-a="conf" data-id="'+esc(m.id)+'" aria-pressed="'+(!!m.conferido)+'" aria-label="Marcar como conferido">'+(m.conferido?I.okf:I.ok)+'</button>'
   +'<button class="ibtn '+(m.fixado?"on-pin":"")+'" data-a="fixar" data-id="'+esc(m.id)+'" aria-pressed="'+(!!m.fixado)+'" aria-label="Fixar no topo">'+(m.fixado?I.pinf:I.pin)+'</button>'
   +'</div><span class="state">'+(m.conferido?"conferido":"a conferir")+'</span></div>';
  if(m.legenda) h += '<p class="cap"><b>'+esc(nm(origem(m)))+'</b> '+esc(m.legenda)+'</p>';
  return h+'</article>';
}

  }).join("")+'</div>';

function viewExtrato(){
  let h = topMonth();
  h += '<div class="search">'+I.search+'<input id="busca" type="search" placeholder="Buscar por categoria ou legenda" value="'+esc(S.busca)+'" aria-label="Buscar movimentações"></div>';
  h += '<div class="chips">'+[["all","Todas"]].concat(S.pers.map(k=>[k.id,k.curto])).map(([k,n])=>'<button class="chip '+(S.filtro===k?"on":"")+'" data-a="filtro" data-f="'+esc(k)+'" aria-pressed="'+(S.filtro===k)+'">'+esc(n)+'</button>').join("")+'</div>';

  if(q) list = list.filter(m=>((m.categoria||"")+" "+(m.legenda||"")+" "+titulo(m)).toLowerCase().includes(q));
  list.sort((a,b)=>b.ts-a.ts);
  let ent=0,gas=0,tr=0;
  for(const m of list){ if(m.tipo==="entrada")ent+=m.valor; else if(m.tipo==="gasto")gas+=m.valor; else tr+=m.valor; }
  h += '<div class="totals"><div><span>Entradas</span><span class="num pos">'+money(ent)+'</span></div><div><span>Gastos</span><span class="num">'+money(gas)+'</span></div><div><span>Movido</span><span class="num neu">'+money(tr)+'</span></div></div>';
  if(!list.length){ h += '<div class="empty"><strong>Nada encontrado</strong>'+(q||S.filtro!=="all"?"Tente outro filtro ou outra busca.":"Nenhuma movimentação neste mês.")+'</div>'; return h; }
  let dia="";
  for(const m of list){
    if(m.data!==dia){ dia=m.data; const [y,mo,d]=dia.split("-").map(Number); const wd=new Date(y,mo-1,d).toLocaleDateString("pt-BR",{weekday:"long"}); h+='<div class="day">'+d+' de '+MESES[mo-1]+' · '+wd+'</div>'; }
    let val, cls;
    if(m.tipo==="entrada"){ val="+"+money(m.valor); cls="pos"; }
    else if(m.tipo==="gasto"){ val="−"+money(m.valor); cls=""; }
    else { val=money(m.valor); cls="neu"; }
    if(S.filtro!=="all" && m.tipo==="transfer"){ if(m.para===S.filtro){val="+"+money(m.valor);cls="pos";} else {val="−"+money(m.valor);cls="";} }
    h += '<div class="row-m">'+av(getP(origem(m)))+'<div class="mid"><b>'+esc(titulo(m))+'</b><span>'+esc([m.categoria,m.legenda].filter(Boolean).join(" · "))+'</span></div><span class="num '+cls+'">'+val+'</span></div>';
  }
  return h;
}

/* ---------- recorte da foto de perfil ---------- */
const CROP_PX = 640;
function abrirCrop(file){
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = ()=>{
    S.crop = {img, url, zoom:1, cx:img.width/2, cy:img.height/2};
    const box = document.getElementById("crop");
    box.innerHTML = '<h2 id="crop-t">Ajuste a foto</h2>'
      +'<canvas id="crop-c" width="'+CROP_PX+'" height="'+CROP_PX+'" aria-label="Prévia do recorte. Arraste para posicionar."></canvas>'
      +'<div class="zoom"><span>Zoom</span><input id="crop-z" type="range" min="1" max="4" step="0.01" value="1" aria-label="Zoom"></div>'
      +'<p>Arraste a foto para posicionar dentro do círculo.</p>'
      +'<div class="row"><button class="btn" data-a="crop-cancelar">Cancelar</button><button class="btn pri" data-a="crop-usar">Usar foto</button></div>';
    box.hidden = false; desenharCrop(); ligarArraste();
  };
  img.onerror = ()=>{ URL.revokeObjectURL(url); toast("Não consegui abrir essa imagem."); };
  img.src = url;
}
function escalaCrop(px){ const c=S.crop; return Math.max(px/c.img.width, px/c.img.height)*c.zoom; }
function limitarCrop(){
  const c=S.crop, sc=escalaCrop(CROP_PX), half=CROP_PX/2/sc;
  c.cx = Math.min(Math.max(c.cx, half), c.img.width-half);
  c.cy = Math.min(Math.max(c.cy, half), c.img.height-half);
}
function desenharCrop(){
  const c=S.crop, cv=document.getElementById("crop-c"); if(!c||!cv) return;
  limitarCrop();
  const x=cv.getContext("2d"), sc=escalaCrop(CROP_PX);
  x.clearRect(0,0,CROP_PX,CROP_PX);
  x.drawImage(c.img, CROP_PX/2-c.cx*sc, CROP_PX/2-c.cy*sc, c.img.width*sc, c.img.height*sc);
  x.save(); x.fillStyle="rgba(5,6,10,.6)"; x.beginPath(); x.rect(0,0,CROP_PX,CROP_PX); x.arc(CROP_PX/2,CROP_PX/2,CROP_PX/2-6,0,Math.PI*2,true); x.fill("evenodd");
  x.strokeStyle="rgba(255,255,255,.7)"; x.lineWidth=2; x.beginPath(); x.arc(CROP_PX/2,CROP_PX/2,CROP_PX/2-6,0,Math.PI*2); x.stroke(); x.restore();
}
function ligarArraste(){
  const cv=document.getElementById("crop-c"); let last=null;
  cv.addEventListener("pointerdown", e=>{ last={x:e.clientX,y:e.clientY}; cv.setPointerCapture(e.pointerId); cv.style.cursor="grabbing"; });
  cv.addEventListener("pointermove", e=>{
    if(!last||!S.crop) return;
    const k = CROP_PX/cv.getBoundingClientRect().width, sc=escalaCrop(CROP_PX);
    S.crop.cx -= (e.clientX-last.x)*k/sc; S.crop.cy -= (e.clientY-last.y)*k/sc;
    last={x:e.clientX,y:e.clientY}; desenharCrop();
  });
  const fim = ()=>{ last=null; cv.style.cursor="grab"; };
  cv.addEventListener("pointerup", fim); cv.addEventListener("pointercancel", fim);
  cv.addEventListener("wheel", e=>{ e.preventDefault(); const z=document.getElementById("crop-z"); S.crop.zoom=Math.min(4,Math.max(1,S.crop.zoom*(e.deltaY<0?1.08:1/1.08))); z.value=S.crop.zoom; desenharCrop(); }, {passive:false});
}
function fecharCrop(){ const c=S.crop; if(c) URL.revokeObjectURL(c.url); S.crop=null; const b=document.getElementById("crop"); b.hidden=true; b.innerHTML=""; }
function usarCrop(){
  const c=S.crop, out=512, cv=document.createElement("canvas"); cv.width=out; cv.height=out;
  limitarCrop(); const sc=escalaCrop(out);
  cv.getContext("2d").drawImage(c.img, out/2-c.cx*sc, out/2-c.cy*sc, c.img.width*sc, c.img.height*sc);
  cv.toBlob(b=>{
    if(!b){ toast("Não consegui recortar a foto."); return; }
    const e=S.edit; if(e){ if(e.fotoNovaURL) URL.revokeObjectURL(e.fotoNovaURL); e.fotoNova=b; e.fotoNovaURL=URL.createObjectURL(b); e.removerFoto=false; }
    fecharCrop(); render();
  }, "image/jpeg", .88);
}

async function publicar(){

  f.enviando=true; S.err=""; renderSheet();

}

/* ---------- backup ---------- */
function blobToDataURL(b){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(b); }); }
async function exportar(){
  try{
    toast("Preparando backup…");
    const fotos = {};
    if(IDB.db){ for(const k of await IDB.keys("fotos")){ const b=await IDB.get("fotos",k); if(b) fotos[k]=await blobToDataURL(b); } }
    const data = {app:"pablo-financas", versao:2, exportadoEm:new Date().toISOString(), cfg:S.cfg, pers:S.pers, movs:S.movs, fotos};
    const blob = new Blob([JSON.stringify(data)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "backup-financas-"+today()+".json";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    try{ localStorage.setItem("ultimoBackup", today()); }catch(_){}
    render(); toast("Backup exportado");
  }catch(e){ toast("Não deu para exportar."); }
}
async function importar(file){
  try{
    const d = JSON.parse(await file.text());
    if(d.app!=="pablo-financas" || !Array.isArray(d.movs)) throw new Error("formato");
    const pers = Array.isArray(d.pers) && d.pers.length ? d.pers : personalidadesPadrao(d.cfg||{});
    const cfg = {reservaMeses: (d.cfg && d.cfg.reservaMeses!=null) ? d.cfg.reservaMeses : 6};
    if(IDB.db){
      await IDB.clear("movs"); await IDB.clear("fotos"); await IDB.clear("pers");
      for(const m of d.movs) await IDB.put("movs", m);
      for(const p of pers) await IDB.put("pers", p);
      for(const [id,url] of Object.entries(d.fotos||{})){ const b = await (await fetch(url)).blob(); await IDB.put("fotos", b, id); }
      await IDB.put("cfg", cfg, "app");
    }
    for(const u of fotoCache.values()) URL.revokeObjectURL(u); fotoCache.clear();
    S.movs = d.movs; S.pers = pers.sort((a,b)=>(a.ordem||0)-(b.ordem||0)); S.cfg = cfg;
    S.importar=false; S.view="home"; render(); toast("Backup restaurado: "+d.movs.length+" movimentações");
  }catch(e){ S.importar=false; render(); toast("Esse arquivo não é um backup do app."); }
}

  const ini = (oldCfg && oldCfg.inicial) || {};
  return [

function renderNav(){
  const v = S.view==="editar" ? (S.voltar||"perfil") : S.view;
  const it = (k,icon,label)=>'<button class="ibtn '+(v===k?"on":"")+'" data-a="go" data-v="'+k+'" aria-label="'+label+'" '+(v===k?'aria-current="page"':'')+'>'+icon+'</button>';
  document.getElementById("nav").innerHTML = it("home",I.home,"Início")+it("extrato",I.list,"Extrato")
    +'<button class="plus" data-a="nova" aria-label="Nova movimentação">'+I.plus+'</button>'
    +it("perfil",I.user,"Perfis")+it("ajustes",I.gear,"Ajustes");
}
function render(){
  const app = document.getElementById("app");
  const ae = document.activeElement;
  const focusId = ae && ae.id && app.contains(ae) ? ae.id : null;
  app.innerHTML = S.view==="perfil"?viewPerfil():S.view==="extrato"?viewExtrato():S.view==="ajustes"?viewAjustes():S.view==="editar"?viewEditar():viewHome();
  renderNav();
  hidratarFotos(app);
  if(focusId){ const el=document.getElementById(focusId); if(el){ el.focus(); if(el.setSelectionRange && /^(text|search)$/.test(el.type||"text") && el.tagName==="INPUT"){ const l=el.value.length; try{el.setSelectionRange(l,l);}catch(e){} } } }
}
let tt;
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.hidden=false; clearTimeout(tt); tt=setTimeout(()=>el.hidden=true,2000); }

/* ======================================================================
   EVENTOS
   ====================================================================== */
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-a]"); if(!b) return;
  const a = b.dataset.a, f = S.form, ed = S.edit;
  switch(a){
    case "go": S.view=b.dataset.v; S.edit=null; S.del=null; S.importar=false; render(); window.scrollTo(0,0); break;
    case "nova": abrirNova(b.dataset.p); break;
    case "fechar": fecharNova(); break;
    case "mes": shiftMonth(Number(b.dataset.n)); S.del=null; render(); break;
    case "perfil": S.perfil=b.dataset.p; S.view="perfil"; render(); window.scrollTo(0,0); break;
    case "nova-pers": abrirEditor(null); break;
    case "editar-pers": abrirEditor(b.dataset.p); break;
    case "filtro": S.filtro=b.dataset.f; render(); break;
    case "menu": S.del = b.dataset.id && S.del!==b.dataset.id ? b.dataset.id : null; render(); break;
    case "apagar": apagarMov(b.dataset.id); break;
    case "conf": { const m=S.movs.find(x=>x.id===b.dataset.id); if(m) patchMov(m.id,{conferido:!m.conferido}); break; }
    case "fixar": { const m=S.movs.find(x=>x.id===b.dataset.id); if(m) patchMov(m.id,{fixado:!m.fixado}); break; }
    case "exportar": exportar(); break;
    case "importar-pedir": S.importar=true; render(); break;
    case "importar-cancelar": S.importar=false; render(); break;
    /* editor */
    case "ed-cor": ed.cor=b.dataset.c; render(); break;
    case "ed-salvar": salvarEditor(); break;
    case "pfoto-tirar": if(ed.fotoNovaURL) URL.revokeObjectURL(ed.fotoNovaURL); ed.fotoNova=null; ed.fotoNovaURL=null; ed.removerFoto=true; render(); break;
    case "ed-apagar-pedir": ed.confirmDel=true; render(); break;
    case "ed-apagar-cancelar": ed.confirmDel=false; render(); break;
    case "ed-apagar": apagarPers(); break;
    case "crop-cancelar": fecharCrop(); break;
    case "crop-usar": usarCrop(); break;
    /* nova movimentação */
    case "tipo": f.tipo=b.dataset.t; f.categoria=""; if(f.tipo==="entrada" && getP("rico")) f.conta="rico"; if(f.tipo==="gasto" && getP("emocional")) f.conta="emocional"; S.err=""; renderSheet(); break;
    case "conta": f.conta=b.dataset.p; renderSheet(); break;
    case "de": f.de=b.dataset.p; if(f.para===f.de){ const o=S.pers.find(k=>k.id!==f.de); if(o) f.para=o.id; } renderSheet(); break;
    case "para": f.para=b.dataset.p; if(f.de===f.para){ const o=S.pers.find(k=>k.id!==f.para); if(o) f.de=o.id; } renderSheet(); break;
    case "inverter": [f.de,f.para]=[f.para,f.de]; renderSheet(); break;
    case "cat": f.categoria = f.categoria===b.dataset.c?"":b.dataset.c; renderSheet(); break;
    case "tirar-foto": if(f.fotoUrl) URL.revokeObjectURL(f.fotoUrl); f.fotoFile=null; f.fotoUrl=null; renderSheet(); break;
    case "publicar": publicar(); break;
  }
});
document.addEventListener("input", e=>{
  const t = e.target;
  if(t.classList.contains("money")){
    const cents = Math.min(parseInt(t.value.replace(/\D/g,"")||"0",10), 99999999999);
    t.value = money(cents);
    const k = t.dataset.k, scope = t.dataset.scope;
    if(scope==="form" && S.form){ S.form.valor=cents; const hn=document.getElementById("hint-num"); const ref=S.form.tipo==="transfer"?S.form.de:S.form.conta; if(hn) hn.textContent=money(saldo(ref)-cents); }
    else if(scope==="edit" && S.edit) S.edit[k]=cents;
    try{ t.setSelectionRange(t.value.length,t.value.length); }catch(_){}
    return;
  }
  if(t.id==="busca"){ S.busca=t.value; render(); return; }
  if(t.id==="crop-z" && S.crop){ S.crop.zoom=Number(t.value); desenharCrop(); return; }
  if(S.edit){ if(t.id==="ed-nome") S.edit.nome=t.value; if(t.id==="ed-curto") S.edit.curto=t.value; if(t.id==="ed-bio") S.edit.bio=t.value; }
  if(S.form){ if(t.id==="legenda") S.form.legenda=t.value; if(t.id==="data") S.form.data=t.value; }
});
document.addEventListener("change", e=>{
  const t = e.target;
  if(t.id==="arq-backup" && t.files && t.files[0]){ importar(t.files[0]); return; }
  if(t.id==="aj-meses"){ const n=Math.max(0,Math.min(36,parseInt(t.value||"0",10)||0)); S.cfg.reservaMeses=n; t.value=n; salvarCfg(); toast("Reserva: "+n+" meses"); return; }
  if(t.id==="pfoto" && t.files && t.files[0]){ abrirCrop(t.files[0]); t.value=""; return; }
  if(t.id==="data" && S.form) S.form.data=t.value;
  if(t.id==="foto" && S.form && t.files && t.files[0]){
    const file=t.files[0];
    if(file.size>25*1024*1024){ S.err="A foto passa de 25 MB. Escolha uma menor."; renderSheet(); return; }
    if(S.form.fotoUrl) URL.revokeObjectURL(S.form.fotoUrl);
    S.form.fotoFile=file; S.form.fotoUrl=URL.createObjectURL(file); S.err=""; renderSheet();
  }
});
document.addEventListener("keydown", e=>{
  if(e.key!=="Escape") return;
  if(S.crop) fecharCrop(); else if(S.form) fecharNova();
});

/* ======================================================================
   CÉU
   ====================================================================== */
function sky(){
  const c=document.getElementById("sky"), dpr=Math.min(2,window.devicePixelRatio||1), w=innerWidth, h=innerHeight;
  c.width=w*dpr; c.height=h*dpr; const x=c.getContext("2d"); x.scale(dpr,dpr);
  let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const n=Math.round(w*h/2600);
  for(let i=0;i<n;i++){ const r=rnd()<.92?.6:1.1; x.globalAlpha=.25+rnd()*.6; x.fillStyle=rnd()<.15?"#BFD3FF":"#FFFFFF"; x.beginPath(); x.arc(rnd()*w,rnd()*h,r,0,6.283); x.fill(); }
}
sky(); addEventListener("resize", ()=>{ clearTimeout(sky.t); sky.t=setTimeout(sky,200); });

/* ======================================================================
   INÍCIO
   ====================================================================== */
render();
(async ()=>{
  try{
    await IDB.open();
    S.movs = await IDB.all("movs") || [];
    const c = await IDB.get("cfg","app") || {};
    S.pers = (await IDB.all("pers") || []).sort((a,b)=>(a.ordem||0)-(b.ordem||0));
    if(!S.pers.length){
      S.pers = personalidadesPadrao(c);
      for(const p of S.pers) await IDB.put("pers", p);
    }
    S.cfg = {reservaMeses: c.reservaMeses!=null ? c.reservaMeses : 6};
    await IDB.put("cfg", S.cfg, "app");
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  }catch(e){
    IDB.db=null; S.dbErro=true;
    if(!S.pers.length) S.pers = personalidadesPadrao({});
  }
  S.perfil = S.pers[0] && S.pers[0].id;
  S.ready=true; render();
})();
if("serviceWorker" in navigator && location.protocol==="https:"){
  addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
})();
</script>
